<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Médicas de Occidente</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500&display=swap" rel="stylesheet">

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #eef2f0;
}

/* HEADER */
.header {
  position: relative;
  background: #2e6e3a;
  color: white;
  padding: 15px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.header h2 {
  font-family: 'Playfair Display', serif;
}

/* MENU CENTRADO */
.menu {
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  gap: 8px;
}

.menu button {
  background: #4f9b61;
  border: none;
  color: white;
  padding: 6px 12px;
  border-radius: 20px;
  cursor: pointer;
}

.menu button.activo {
  background: white;
  color: #2e6e3a;
}

/* CARRITO */
.carrito-btn {
  background: white;
  color: #2e6e3a;
  padding: 6px 12px;
  border-radius: 20px;
  cursor: pointer;
}

/* BANNER */
.banner {
  position: relative;
}

.banner img {
  width: 100%;
  display: block;
}

/* FARMACÉUTICO */
.farma-widget {
  position: absolute;
  left: 20px;
  top: 50%;
  transform: translateY(-50%);
  z-index: 5;
  display: flex;
  align-items: center;
  gap: 10px;
  cursor: pointer;
}

.farma-img {
  width: 90px;
  max-width: 90px;
  min-width: 90px;
  height: auto;
  display: block;
  flex-shrink: 0;
  animation: floatOnly 3s ease-in-out infinite;
}

.speech {
  position: relative;
  background: white;
  padding: 10px;
  border-radius: 12px;
  width: 180px;
  height: 55px;
  font-size: 12px;
  box-shadow: 0 6px 15px rgba(0,0,0,0.12);
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
}

.speech::after {
  content: "";
  position: absolute;
  left: -10px;
  top: 50%;
  transform: translateY(-50%);
  border: 10px solid transparent;
  border-right-color: white;
}

@keyframes floatOnly {
  0%,100% { transform: translateY(0); }
  50% { transform: translateY(-5px); }
}

/* PRODUCTOS */
.productos {
  display: grid;
  grid-template-columns: repeat(auto-fit,minmax(200px,1fr));
  gap: 20px;
  padding: 20px;
}

.card {
  background: white;
  border-radius: 15px;
  padding: 15px;
  text-align: center;
}

.card img {
  width: 100%;
  height: 160px;
  object-fit: cover;
}

/* TOAST */
.toast-container {
  position: fixed;
  top: 20px;
  right: 20px;
  z-index: 9999;
}

.toast {
  display: flex;
  align-items: center;
  gap: 10px;
  background: #2e6e3a;
  color: white;
  padding: 10px 15px;
  border-radius: 12px;
  margin-bottom: 10px;
  min-width: 250px;
  opacity: 0;
  transform: translateX(100%);
  transition: 0.4s;
}

.toast.show {
  opacity: 1;
  transform: translateX(0);
}

.toast img {
  width: 45px;
  height: 45px;
  border-radius: 8px;
}

/* OVERLAY */
.overlay {
  position: fixed;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.6);
  display: none;
  z-index: 10;
}

.overlay.activo {
  display: block;
}

/* CARRITO */
.panel-carrito {
  position: fixed;
  right: -400px;
  top: 0;
  width: 360px;
  height: 100%;
  background: #1f1f1f;
  color: white;
  display: flex;
  flex-direction: column;
  transition: 0.3s;
  z-index: 20;
}

.panel-carrito.activo {
  right: 0;
}

.cerrar-carrito {
  position: absolute;
  top: 10px;
  right: 12px;
  font-size: 20px;
  cursor: pointer;
}

.contenido-carrito {
  flex: 1;
  overflow-y: auto;
  padding: 10px;
}

.item-carrito {
  display: flex;
  gap: 10px;
  background: #2c2c2c;
  padding: 10px;
  border-radius: 10px;
  margin-bottom: 10px;
}

/* IMÁGENES CARRITO */
.item-carrito img {
  width: 50px;
  height: 50px;
  object-fit: cover;
  border-radius: 8px;
}

/* FOOTER */
.footer-carrito {
  padding: 15px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

/* BOTONES CARRITO */
.finalizar {
  background: #25D366;
  padding: 15px;
  border: none;
  color: white;
  border-radius: 10px;
  font-weight: bold;
  cursor: pointer;
}

.vaciar {
  background: red;
  padding: 10px;
  border: none;
  color: white;
  border-radius: 10px;
  cursor: pointer;
}

/* =========================
📱 RESPONSIVE MOBILE
========================= */
@media (max-width: 768px) {

  /* HEADER */
  .header {
    flex-direction: column;
    gap: 10px;
    padding: 10px;
  }

  /* MENU */
  .menu {
    position: static;
    transform: none;
    flex-wrap: wrap;
    justify-content: center;
  }

  /* BOTÓN CARRITO */
  .carrito-btn {
    align-self: flex-end;
  }

  /* FARMACÉUTICO */
  .farma-widget {
    position: static;
    transform: none;
    justify-content: center;
    margin: 10px 0;
  }

  .farma-img {
    width: 70px;
    min-width: 70px;
    max-width: 70px;
  }

  /* BURBUJA */
  .speech {
    width: 160px;
    height: auto;
    font-size: 11px;
    padding: 8px;
  }

  /* PRODUCTOS */
  .productos {
    grid-template-columns: repeat(2, 1fr);
    padding: 10px;
    gap: 10px;
  }

  .card img {
    height: 120px;
  }

  /* CARRITO */
  .panel-carrito {
    width: 100%;
  }

  /* ITEMS CARRITO */
  .item-carrito {
    flex-direction: row;
    align-items: center;
  }

}

/* =========================
📱 MÓVILES PEQUEÑOS
========================= */
@media (max-width: 480px) {

  .productos {
    grid-template-columns: 1fr;
  }

  .speech {
    width: 140px;
    font-size: 10px;
  }

  .farma-img {
    width: 60px;
  }

}
</style>
</head>

<body>

<div class="header">
  <h2>🌿 Médicas de Occidente</h2>

  <div class="menu">
    <button class="activo" onclick="filtrar('todos',this)">Todos</button>
    <button onclick="filtrar('suplemento',this)">Suplementos</button>
    <button onclick="filtrar('malteada',this)">Malteadas</button>
    <button onclick="filtrar('vitamina',this)">Vitaminas</button>
  </div>

  <div class="carrito-btn" onclick="abrirCarrito()" id="carrito">🛒 0</div>
</div>

<div class="banner">
  <div class="farma-widget">
    <img src="farmaceuta.png" class="farma-img">
    <div class="speech" id="farma-text">Hola 👋</div>
  </div>
  <img src="imagen.png">
</div>

<div class="productos" id="productos"></div>
<div class="toast-container" id="toastContainer"></div>
<div class="overlay" id="overlay" onclick="cerrarCarrito()"></div>

<div class="panel-carrito" id="panel">
  <div class="cerrar-carrito" onclick="cerrarCarrito()">✖</div>
  <div class="contenido-carrito" id="lista"></div>
  <div class="footer-carrito">
    <div id="total">Total: $0</div>
    <button class="vaciar" onclick="vaciarCarrito()">Vaciar carrito</button>
    <button class="finalizar" onclick="enviarWhatsApp()">Finalizar pedido por WhatsApp</button>
  </div>
</div>

<script>
// PRODUCTOS
let productos=[
{nombre:"Proteína Natural",precio:25,img:"wheyprot.jpg",categoria:"suplemento"},
{nombre:"Ben 10 Malteada",precio:18,img:"ben10.jpg",categoria:"malteada"},
{nombre:"Citrato de Magnesio",precio:12,img:"citratom.jpg",categoria:"vitamina"},
{nombre:"Citrato de Potasio",precio:15,img:"citratop.jpg",categoria:"vitamina"},
{nombre:"Calsumag",precio:10,img:"calsumag.jpg",categoria:"suplemento"}
];

let carrito=[];

function render(lista){
let cont=document.getElementById("productos");
cont.innerHTML="";
lista.forEach(p=>{
cont.innerHTML+=`
<div class="card">
<img src="${p.img}">
<h3>${p.nombre}</h3>
<p>$${p.precio}</p>
<button onclick="agregar('${p.nombre}',${p.precio},'${p.img}')">Agregar</button>
</div>`;
});
}

function filtrar(cat,btn){
document.querySelectorAll(".menu button").forEach(b=>b.classList.remove("activo"));
btn.classList.add("activo");
if(cat==="todos") render(productos);
else render(productos.filter(p=>p.categoria===cat));
}

function agregar(nombre,precio,img){
let e=carrito.find(p=>p.nombre===nombre);
if(e) e.cantidad++;
else carrito.push({nombre,precio,img,cantidad:1});
actualizar();
mostrarToast(nombre,img);
}

function actualizar(){
let total=0;
let lista=document.getElementById("lista");
lista.innerHTML="";
let cantidadTotal=0;

carrito.forEach(p=>{
total+=p.precio*p.cantidad;
cantidadTotal+=p.cantidad;
lista.innerHTML+=`
<div class="item-carrito">
<img src="${p.img}">
<div>${p.nombre}<br>$${p.precio} x ${p.cantidad}</div>
</div>`;
});

document.getElementById("total").innerText="Total: $"+total;
document.getElementById("carrito").innerText="🛒 "+cantidadTotal;
}

function abrirCarrito(){
panel.classList.add("activo");
overlay.classList.add("activo");
}

function cerrarCarrito(){
panel.classList.remove("activo");
overlay.classList.remove("activo");
}

function vaciarCarrito(){
carrito=[];
actualizar();
}

function enviarWhatsApp(){
let msg="Pedido:%0A";
carrito.forEach(p=>{
msg+=`- ${p.nombre} x${p.cantidad}%0A`;
});
window.open(`https://wa.me/573000000000?text=${msg}`);
}

function mostrarToast(nombre,img){
let cont=document.getElementById("toastContainer");
let toast=document.createElement("div");
toast.className="toast";
toast.innerHTML=`<img src="${img}"><div><strong>${nombre}</strong><br>Agregado</div>`;
cont.appendChild(toast);
setTimeout(()=>toast.classList.add("show"),50);
setTimeout(()=>toast.remove(),2000);
}

// FARMACÉUTICO
const numeroWhatsApp="573000000000";

const preguntas=[
"¿Qué síntoma tienes?",
"¿Desde cuándo?",
"¿Tomas algún medicamento?",
"👉 Toca aquí para recibir asesoría personalizada"
];

let i=0;
const text=document.getElementById("farma-text");
const farma=document.querySelector(".farma-widget");

function nextQuestion(){
text.style.opacity=0;
setTimeout(()=>{
text.textContent=preguntas[i];
text.style.opacity=1;
i++;
if(i<preguntas.length){
setTimeout(nextQuestion,3000);
}
},300);
}

setTimeout(nextQuestion,1000);

farma.addEventListener("click",()=>{
window.open(`https://wa.me/${numeroWhatsApp}?text=Hola quiero asesoría`);
});

render(productos);
</script>

</body>
</html>
