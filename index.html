<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VitalMedic de Occidente</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500&display=swap" rel="stylesheet">

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #eef2f0;
}

/* 🔐 LOGIN OCULTO (NO AFECTA DISEÑO) */
.login-bar{
  position:fixed;
  top:-100px;
  left:50%;
  transform:translateX(-50%);
  background: linear-gradient(90deg,#2e6e3a,#4f9b61);
  padding:10px;
  border-radius:30px;
  display:flex;
  gap:10px;
  align-items:center;
  transition:0.4s;
  z-index:9999;
}

.login-bar.show{
  top:80px;
}

.login-bar input{
  padding:6px;
  border-radius:20px;
  border:none;
}

.login-bar button{
  background:white;
  border:none;
  border-radius:20px;
  padding:6px 12px;
  cursor:pointer;
}

.close-login{
  background:red;
  color:white;
  border:none;
  border-radius:50%;
  width:25px;
  height:25px;
  cursor:pointer;
  font-size:14px;
}

/* HEADER */
.header {
  background:#2e6e3a;
  color:white;
  padding:15px;
  text-align:center;
}

.header h2 {
  font-family: 'Playfair Display', serif;
}

/* BANNER */
.banner {
  position: relative;
}

.banner img {
  width:100%;
  display:block;
}

/* FARMACÉUTICO */
.farma-widget {
  position:absolute;
  left:20px;
  top:50%;
  transform:translateY(-50%);
  display:flex;
  align-items:center;
  gap:8px;
  z-index:5;
}

.farma-img {
  width:80px !important;
}

/* BURBUJA */
.speech {
  position:relative;
  background:white;
  padding:8px;
  border-radius:10px;
  width:140px;
  height:45px;
  font-size:11px;
  display:flex;
  align-items:center;
  justify-content:center;
}

/* PRODUCTOS */
.productos {
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
  gap:20px;
  padding:20px;
}

.card {
  background:white;
  border-radius:15px;
  padding:15px;
  text-align:center;
}

.card img {
  width:100%;
  height:160px;
  object-fit:cover;
}

.precio {
  color:#2e6e3a;
  font-weight:bold;
}
</style>
</head>

<body>

<div class="login-bar" id="loginBox">
  <input id="email" placeholder="Correo vendedor">
  <input id="password" type="password" placeholder="Contraseña">
  <button onclick="loginFirebase()">Ingresar</button>
  <button class="close-login" onclick="cerrarLogin()">✖</button>
</div>

<div class="header">
  <h2>🌿 VitalMedic de Occidente</h2>
</div>

<div class="banner" onclick="activarLogin()">
  <div class="farma-widget">
    <img src="farmaceuta.png" class="farma-img">
    <div class="speech" id="farma-text">¿En qué puedo ayudarte?</div>
  </div>
  <img src="imagen.png">
</div>

<div class="productos" id="productos"></div>

<script>
// PRODUCTOS
let productos=[
{nombre:"Proteína Natural",precio:25,img:"wheyprot.jpg"},
{nombre:"Ben 10 Malteada",precio:18,img:"ben10.jpg"},
{nombre:"Citrato de Magnesio",precio:12,img:"citratom.jpg"},
{nombre:"Citrato de Potasio",precio:15,img:"citratop.jpg"},
{nombre:"Calsumag",precio:10,img:"calsumag.jpg"}
];

function render(){
let cont=document.getElementById("productos");
cont.innerHTML="";
productos.forEach(p=>{
cont.innerHTML+=`
<div class="card">
<img src="${p.img}">
<h3>${p.nombre}</h3>
<p class="precio">$${p.precio}</p>
<p>Disponible</p>
</div>`;
});
}
render();

// FARMACÉUTICO
const preguntas=[
"¿Qué síntoma tienes?",
"Te ayudamos a elegir el mejor producto",
"Consulta con nuestros asesores"
];

let i=0;
const text=document.getElementById("farma-text");

function nextQuestion(){
text.textContent=preguntas[i];
i++;
if(i<preguntas.length){
setTimeout(nextQuestion,3000);
}
}
setTimeout(nextQuestion,2000);

// LOGIN SECRETO
let clicks = 0;
function activarLogin(){
  clicks++;
  if(clicks >= 3){
    document.getElementById("loginBox").classList.add("show");
    clicks = 0;
  }
}

function cerrarLogin(){
  document.getElementById("loginBox").classList.remove("show");
}
</script>

<!-- 🔥 FIREBASE FUNCIONAL -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyBabC4E_6_pEq3Br00KCDSi-z3Y6Vugle4",
  authDomain: "vitalmeddeoccidente.firebaseapp.com",
  projectId: "vitalmeddeoccidente",
  storageBucket: "vitalmeddeoccidente.appspot.com",
  messagingSenderId: "824222646050",
  appId: "1:824222646050:web:ebc6bd51fb855e9e3cef7b"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

window.loginFirebase = function(){
  signInWithEmailAndPassword(auth,email.value,password.value)
  .then(user=>{
    localStorage.setItem("usuario", user.user.email);
    window.location = "pedidos.html"; // 🔥 aquí conectamos con pedidos
  })
  .catch(e=>alert(e.message));
}
</script>

</body>
</html>
