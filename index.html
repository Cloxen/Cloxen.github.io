<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VitalMedic de Occidente</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500&display=swap" rel="stylesheet">

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #eef2f0;
}

/* LOGIN */
.login-bar{
  position:fixed;
  top:-100px;
  left:50%;
  transform:translateX(-50%);
  background: linear-gradient(90deg,#2e6e3a,#4f9b61);
  padding:10px;
  border-radius:30px;
  display:flex;
  gap:10px;
  align-items:center;
  transition:0.4s;
  z-index:9999;
}

.login-bar.show{ top:80px; }

.login-bar input{
  padding:6px;
  border-radius:20px;
  border:none;
}

.login-bar button{
  background:white;
  border:none;
  border-radius:20px;
  padding:6px 12px;
  cursor:pointer;
}

.close-login{
  background:red;
  color:white;
  border:none;
  border-radius:50%;
  width:25px;
  height:25px;
  cursor:pointer;
}

/* HEADER */
.header {
  background:#2e6e3a;
  color:white;
  padding:15px;
  text-align:center;
}

.header h2 {
  font-family: 'Playfair Display', serif;
}

/* BANNER */
.banner { position: relative; }
.banner img { width:100%; display:block; }

/* FARMACÉUTICO */
.farma-widget {
  position:absolute;
  left:20px;
  top:50%;
  transform:translateY(-50%);
  display:flex;
  align-items:center;
  gap:8px;
}

.farma-img {
  width:80px !important;
  max-width:80px !important;
  min-width:80px !important;
  height:auto;
  object-fit:contain;
}

/* BURBUJA */
.speech {
  background:white;
  padding:8px;
  border-radius:10px;
  width:140px;
  height:45px;
  font-size:11px;
  display:flex;
  align-items:center;
  justify-content:center;
}

/* PRODUCTOS */
.productos {
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
  gap:20px;
  padding:20px;
}

.card {
  background:white;
  border-radius:15px;
  padding:15px;
  text-align:center;
}

.card img {
  width:100%;
  height:160px;
  object-fit:cover;
}

.precio { color:#2e6e3a; font-weight:bold; }
</style>
</head>

<body>

<!-- LOGIN -->
<div class="login-bar" id="loginBox">
  <input id="email" placeholder="Correo vendedor">
  <input id="password" type="password" placeholder="Contraseña">
  <button onclick="loginFirebase()">Ingresar</button>
  <button class="close-login" onclick="cerrarLogin()">✖</button>
</div>

<!-- HEADER -->
<div class="header">
  <h2>🌿 VitalMedic de Occidente</h2>
</div>

<!-- BANNER -->
<div class="banner" onclick="activarLogin()">
  <div class="farma-widget">
    <img src="farmaceuta.png" class="farma-img">
    <div class="speech" id="farma-text">¿En qué puedo ayudarte?</div>
  </div>
  <img src="imagen.png">
</div>

<!-- PRODUCTOS -->
<div class="productos" id="productos"></div>

<script>
// PRODUCTOS
let productos=[
{nombre:"Proteína Natural",precio:25,img:"wheyprot.jpg"},
{nombre:"Ben 10 Malteada",precio:18,img:"ben10.jpg"},
{nombre:"Citrato de Magnesio",precio:12,img:"citratom.jpg"},
{nombre:"Citrato de Potasio",precio:15,img:"citratop.jpg"},
{nombre:"Calsumag",precio:10,img:"calsumag.jpg"}
];

function render(){
let cont=document.getElementById("productos");
cont.innerHTML="";
productos.forEach(p=>{
cont.innerHTML+=`
<div class="card">
<img src="${p.img}">
<h3>${p.nombre}</h3>
<p class="precio">$${p.precio}</p>
<p>Disponible</p>
</div>`;
});
}
render();

// FARMACÉUTICO
const preguntas=[
"¿Qué síntoma tienes?",
"Te ayudamos a elegir el mejor producto",
"Consulta con nuestros asesores"
];

let i=0;
const text=document.getElementById("farma-text");

function nextQuestion(){
text.textContent=preguntas[i];
i++;
if(i<preguntas.length){
setTimeout(nextQuestion,3000);
}
}
setTimeout(nextQuestion,2000);

// LOGIN
let clicks = 0;

function activarLogin(){
  clicks++;
  if(clicks >= 3){
    loginBox.classList.add("show");
    clicks = 0;
  }
}

function cerrarLogin(){
  loginBox.classList.remove("show");
}
</script>

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Pedidos</title>

<style>
body{font-family:Arial;background:#eef2f0;margin:0;}
.header{background:#2e6e3a;color:white;padding:15px;text-align:center;}
.container{padding:20px;}
.form,.pedido{background:white;padding:15px;border-radius:10px;margin-bottom:10px;}
input,textarea{width:100%;margin:5px 0;padding:10px;}
button{padding:10px;background:#2e6e3a;color:white;border:none;border-radius:8px;}
</style>
</head>

<body>

<div class="header">
<h2>📦 Pedidos</h2>
</div>

<div class="container">

<div class="form">
<input id="cliente" placeholder="Cliente">
<textarea id="productos" placeholder="Productos"></textarea>
<textarea id="obs" placeholder="Observaciones"></textarea>
<button onclick="crearPedido()">Enviar Pedido</button>
</div>

<div id="lista"></div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, addDoc, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBabC4E_6_pEq3Br00KCDSi-z3Y6Vugle4",
  authDomain: "vitalmeddeoccidente.firebaseapp.com",
  projectId: "vitalmeddeoccidente",
  storageBucket: "vitalmeddeoccidente.appspot.com",
  messagingSenderId: "824222646050",
  appId: "1:824222646050:web:ebc6bd51fb855e9e3cef7b"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const usuario = localStorage.getItem("usuario");

// CREAR PEDIDO
window.crearPedido = async function(){
  if(!usuario){
    alert("No hay sesión");
    return;
  }

  await addDoc(collection(db,"pedidos"),{
    cliente: cliente.value,
    productos: productos.value,
    obs: obs.value,
    vendedor: usuario,
    fecha: Date.now()
  });

  alert("Pedido guardado");

  cliente.value="";
  productos.value="";
  obs.value="";
}

// LISTAR PEDIDOS
const q = query(collection(db,"pedidos"), orderBy("fecha","desc"));

onSnapshot(q,(snap)=>{
  lista.innerHTML="";

  snap.forEach(doc=>{
    let p = doc.data();

    // 🔥 ADMIN VE TODO
    if(usuario !== "adminvm@gmail.com" && p.vendedor !== usuario) return;

    lista.innerHTML += `
    <div class="pedido">
      <b>${p.cliente}</b><br>
      ${p.productos}<br>
      <small>${p.vendedor}</small>
    </div>`;
  });
});
</script>

</body>
</html>

</body>
</html>
