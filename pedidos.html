<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pedidos - VitalMedic</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:'Poppins',sans-serif;
  background:#eef2f0;
  color:#222;
}

/* HEADER */
.header{
  background:linear-gradient(90deg,#2e6e3a,#4f9b61);
  color:white;
  padding:15px 20px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  position:sticky;
  top:0;
  z-index:100;
  box-shadow:0 4px 10px rgba(0,0,0,0.15);
}

.header h2{
  font-size:22px;
  font-weight:600;
}

.logout{
  background:#ff4d4d;
  border:none;
  color:white;
  padding:10px 14px;
  border-radius:12px;
  cursor:pointer;
  font-weight:600;
  transition:0.2s;
}

.logout:hover{
  transform:scale(1.05);
}

/* CONTENEDOR */
.container{
  padding:20px;
  max-width:1100px;
  margin:auto;
}

/* FORMULARIO */
.form{
  background:white;
  padding:20px;
  border-radius:20px;
  box-shadow:0 8px 20px rgba(0,0,0,0.08);
  margin-bottom:25px;
}

.form h3{
  margin-bottom:15px;
  color:#2e6e3a;
}

input,textarea{
  width:100%;
  padding:14px;
  border-radius:14px;
  border:1px solid #ddd;
  margin-top:10px;
  font-family:'Poppins',sans-serif;
  font-size:14px;
}

textarea{
  resize:none;
}

/* BUSCADOR */
.busqueda{
  display:flex;
  gap:10px;
  margin-top:10px;
}

.busqueda input[type="text"]{
  flex:1;
}

.cantidad{
  width:90px !important;
}

/* BOTONES */
button{
  border:none;
  cursor:pointer;
  transition:0.2s;
}

.agregar-btn{
  background:#2e6e3a;
  color:white;
  padding:12px 16px;
  border-radius:14px;
  font-weight:600;
}

.agregar-btn:hover{
  transform:scale(1.03);
}

.guardar-btn{
  width:100%;
  background:#25D366;
  color:white;
  padding:15px;
  margin-top:15px;
  border-radius:16px;
  font-size:15px;
  font-weight:600;
}

/* SUGERENCIAS */
.sugerencias{
  background:white;
  border-radius:14px;
  margin-top:5px;
  overflow:hidden;
  border:1px solid #ddd;
}

.sugerencia{
  padding:12px;
  cursor:pointer;
  transition:0.2s;
}

.sugerencia:hover{
  background:#f3f3f3;
}

/* PRODUCTOS AGREGADOS */
.item{
  background:#f8f8f8;
  border-radius:16px;
  padding:12px;
  margin-top:12px;
  display:flex;
  align-items:center;
  gap:12px;
  box-shadow:0 4px 10px rgba(0,0,0,0.05);
}

.item img{
  width:55px;
  height:55px;
  object-fit:contain;
  background:white;
  border-radius:12px;
  padding:4px;
}

.item-info{
  flex:1;
}

.item-nombre{
  font-weight:600;
}

.controles{
  display:flex;
  align-items:center;
  gap:8px;
}

.controles button{
  width:30px;
  height:30px;
  border-radius:50%;
  background:#2e6e3a;
  color:white;
  font-size:18px;
}

.delete{
  background:#ff4d4d !important;
}

/* PEDIDOS */
.pedido{
  background:white;
  border-radius:18px;
  padding:18px;
  margin-bottom:15px;
  box-shadow:0 6px 18px rgba(0,0,0,0.08);
}

.pedido-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:10px;
}

.badge{
  background:#fff3cd;
  color:#856404;
  padding:5px 10px;
  border-radius:10px;
  font-size:12px;
  font-weight:600;
}

.fecha{
  font-size:12px;
  color:#777;
  margin-top:10px;
}

.admin-delete{
  background:#ff4d4d;
  color:white;
  padding:8px 12px;
  border-radius:10px;
  margin-top:10px;
}

/* RESPONSIVE */
@media(max-width:768px){

  .busqueda{
    flex-direction:column;
  }

  .cantidad{
    width:100% !important;
  }

  .header{
    flex-direction:column;
    gap:10px;
  }

}
</style>
</head>

<body>

<div class="header">
  <h2>📦 Panel de Pedidos</h2>
  <button class="logout" onclick="cerrarSesion()">Cerrar sesión</button>
</div>

<div class="container">

<div class="form">

<h3>Nuevo Pedido</h3>

<input id="cliente" placeholder="Nombre del cliente">

<div class="busqueda">
  <input id="buscador" type="text" placeholder="Buscar producto">
  <input id="cantidadInput" class="cantidad" type="number" min="1" value="1">
  <button class="agregar-btn" onclick="agregarSeleccionado()">Agregar</button>
</div>

<div id="sugerencias" class="sugerencias"></div>

<div id="seleccionados"></div>

<textarea id="obs" rows="4" placeholder="Observaciones"></textarea>

<button class="guardar-btn" onclick="crearPedido()">Guardar Pedido</button>

</div>

<div id="lista"></div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import {
getFirestore,
collection,
addDoc,
onSnapshot,
deleteDoc,
doc,
query,
orderBy
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBabC4E_6_pEq3Br00KCDSi-z3Y6Vugle4",
  authDomain: "vitalmeddeoccidente.firebaseapp.com",
  projectId: "vitalmeddeoccidente",
  storageBucket: "vitalmeddeoccidente.appspot.com",
  messagingSenderId: "824222646050",
  appId: "1:824222646050:web:ebc6bd51fb855e9e3cef7b"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const usuario = localStorage.getItem("usuario");

/* PRODUCTOS */
const productos = [

{
nombre:"Proteína Natural",
img:"wheyprot.png"
},

{
nombre:"Ben 10 Malteada",
img:"Ben10.png"
},

{
nombre:"Citrato de Magnesio",
img:"Citratom.png"
},

{
nombre:"Citrato de Potasio",
img:"Citratop.png"
},

{
nombre:"Calsumag",
img:"Calsumag800g.jpeg"
},

{
nombre:"Colasteel",
img:"Colasteel.jpeg"
},

{
nombre:"GreenFit",
img:"Greenfit700g.png"
}

];

let seleccionados = [];
let productoSeleccionado = null;

const buscador = document.getElementById("buscador");
const sugerencias = document.getElementById("sugerencias");
const seleccionadosDiv = document.getElementById("seleccionados");
const lista = document.getElementById("lista");

/* AUTOCOMPLETE */
buscador.addEventListener("input",()=>{

  sugerencias.innerHTML="";

  let val = buscador.value.toLowerCase();

  productos.forEach(p=>{

    if(p.nombre.toLowerCase().includes(val)){

      let div=document.createElement("div");

      div.className="sugerencia";
      div.textContent=p.nombre;

      div.onclick=()=>{
        productoSeleccionado=p;
        buscador.value=p.nombre;
        sugerencias.innerHTML="";
      }

      sugerencias.appendChild(div);

    }

  });

});

/* AGREGAR */
window.agregarSeleccionado = function(){

  if(!productoSeleccionado){
    alert("Selecciona un producto");
    return;
  }

  let cantidad = parseInt(document.getElementById("cantidadInput").value);

  let existe = seleccionados.find(x=>x.nombre===productoSeleccionado.nombre);

  if(existe){
    existe.cantidad += cantidad;
  }else{
    seleccionados.push({
      ...productoSeleccionado,
      cantidad:cantidad
    });
  }

  productoSeleccionado=null;
  buscador.value="";
  document.getElementById("cantidadInput").value=1;

  render();

}

/* RENDER */
function render(){

  seleccionadosDiv.innerHTML="";

  seleccionados.forEach((p,i)=>{

    let div=document.createElement("div");

    div.className="item";

    div.innerHTML=`
      <img src="${p.img}">

      <div class="item-info">
        <div class="item-nombre">${p.nombre}</div>
        <small>Cantidad: ${p.cantidad}</small>
      </div>

      <div class="controles">
        <button onclick="menos(${i})">-</button>
        <button onclick="mas(${i})">+</button>
        <button class="delete" onclick="eliminarProducto(${i})">X</button>
      </div>
    `;

    seleccionadosDiv.appendChild(div);

  });

}

/* CONTROLES */
window.mas=function(i){
  seleccionados[i].cantidad++;
  render();
}

window.menos=function(i){
  if(seleccionados[i].cantidad>1){
    seleccionados[i].cantidad--;
  }
  render();
}

window.eliminarProducto=function(i){
  seleccionados.splice(i,1);
  render();
}

/* GUARDAR */
window.crearPedido = async function(){

  if(seleccionados.length===0){
    alert("Agrega productos");
    return;
  }

  if(!confirm("¿Guardar pedido?")) return;

  await addDoc(collection(db,"pedidos"),{
    cliente:cliente.value,
    productos:seleccionados,
    obs:obs.value,
    vendedor:usuario,
    fecha:Date.now(),
    estado:"Pendiente"
  });

  alert("Pedido guardado");

  seleccionados=[];
  render();

}

/* LISTAR */
const q = query(collection(db,"pedidos"), orderBy("fecha","desc"));

onSnapshot(q,(snap)=>{

  lista.innerHTML="";

  snap.forEach(d=>{

    let p=d.data();

    if(usuario!=="adminvm@gmail.com" && p.vendedor!==usuario) return;

    let fecha = new Date(p.fecha).toLocaleString();

    lista.innerHTML += `
    <div class="pedido">

      <div class="pedido-top">
        <b>${p.cliente}</b>
        <div class="badge">${p.estado}</div>
      </div>

      ${p.productos.map(x=>`${x.nombre} x${x.cantidad}`).join("<br>")}

      <div class="fecha">
        ${fecha}<br>
        ${p.vendedor}
      </div>

      ${
        usuario==="adminvm@gmail.com"
        ? `<button class="admin-delete" onclick="eliminar('${d.id}')">Eliminar</button>`
        : ""
      }

    </div>
    `;

  });

});

/* ELIMINAR */
window.eliminar = async function(id){
  await deleteDoc(doc(db,"pedidos",id));
}

/* LOGOUT */
window.cerrarSesion=function(){
  localStorage.removeItem("usuario");
  window.location="index.html";
}

</script>

</body>
</html>
